name: Rebuild Vidrock

on:
  push:
    branches: [main]
    paths:
      - 'src/_shared/sources/vidrock.js'
      - 'src/vidrock/**'
      - 'src/_shared/**'
      - 'build.js'
      - '.github/workflows/rebuild-vidrock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node build.js vidrock
      - name: Commit rebuilt provider
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add providers/vidrock.js
          if git diff --cached --quiet; then echo 'No rebuild changes.'; else git commit -m 'Rebuild Vidrock provider for Nuvio runtime'; git push; fi
