name: Generate category images

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate_category_images.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate JPG images
        run: python tools/generate_category_images.py
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add category images'
          git push
