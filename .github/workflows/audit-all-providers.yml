name: Audit All Nuvio Providers

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'providers/**'
      - '.github/workflows/audit-all-providers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Audit manifest, syntax, exports, and live smoke calls
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');

          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const scrapers = Array.isArray(manifest.scrapers) ? manifest.scrapers : [];
          const ids = new Set();
          let hardFailures = 0;
          const rows = [];

          function shortError(e) {
            return String(e && e.message || e || 'unknown').replace(/\s+/g, ' ').slice(0, 180);
          }

          for (const s of scrapers) {
            const row = { id: s.id, file: s.filename, enabled: !!s.enabled, syntax: false, export: false, smoke: 'SKIP', error: '' };
            if (!s.id || ids.has(s.id)) {
              row.error = 'duplicate or missing scraper id';
              hardFailures++;
              rows.push(row);
              continue;
            }
            ids.add(s.id);

            if (!s.filename || !s.filename.startsWith('providers/')) {
              row.error = 'invalid provider filename';
              hardFailures++;
              rows.push(row);
              continue;
            }
            if (!fs.existsSync(s.filename)) {
              row.error = 'manifest points to missing file';
              hardFailures++;
              rows.push(row);
              continue;
            }

            try {
              cp.execFileSync(process.execPath, ['--check', s.filename], { stdio: 'pipe' });
              row.syntax = true;
            } catch (e) {
              row.error = 'syntax: ' + shortError(e.stderr || e);
              hardFailures++;
              rows.push(row);
              continue;
            }

            try {
              delete require.cache[require.resolve('./' + s.filename)];
              const p = require('./' + s.filename);
              row.export = !!(p && typeof p.getStreams === 'function');
              if (!row.export) {
                row.error = 'getStreams export missing';
                hardFailures++;
                rows.push(row);
                continue;
              }

              if (!s.enabled) {
                rows.push(row);
                continue;
              }

              // Smoke tests verify the provider can enter its Nuvio contract.
              // We intentionally log counts only, never the returned URLs.
              const movie = Promise.resolve().then(() => p.getStreams('550', 'movie', undefined, undefined));
              const timed = Promise.race([
                movie,
                new Promise((_, reject) => setTimeout(() => reject(new Error('smoke timeout')), 20000))
              ]);

              timed.then(result => {
                row.smoke = Array.isArray(result) ? ('PASS(' + result.length + ')') : 'FAIL(non-array)';
                if (!Array.isArray(result)) hardFailures++;
              }).catch(e => {
                row.smoke = 'ERROR';
                row.error = 'smoke: ' + shortError(e);
              }).finally(() => {
                rows.push(row);
                if (rows.length === scrapers.length) finish();
              });
              continue;
            } catch (e) {
              row.error = 'load: ' + shortError(e);
              row.export = false;
              hardFailures++;
            }
            rows.push(row);
          }

          function finish() {
            console.log('\n=== NUVIO PROVIDER AUDIT ===');
            console.log('Provider count:', scrapers.length);
            console.log('Enabled:', scrapers.filter(x => x.enabled).length);
            console.log('');
            for (const r of rows.sort((a,b) => String(a.id).localeCompare(String(b.id)))) {
              console.log(JSON.stringify(r));
            }
            console.log('\nHard failures:', hardFailures);
            // Live source failure alone is not a hard failure because remote
            // providers may transiently block CI. Structural failures are.
            process.exit(hardFailures > 0 ? 1 : 0);
          }

          if (rows.length === scrapers.length) finish();
          NODE
