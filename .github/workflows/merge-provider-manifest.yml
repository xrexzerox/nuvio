name: Merge Provider Manifest

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'providers/**'
      - '.github/workflows/merge-provider-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge NVV-compatible providers into manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('manifest.json')
          m=json.loads(p.read_text())
          scrapers={s.get('id'):s for s in m.get('scrapers',[]) if s.get('id')}
          entries=[
            ('animotvslash','ANIMOTVSLASH','Anime streams from animotvslash.org','providers/animotvslash.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
            ('animepahe','AnimePahe','AnimePahe Sub/Dub streams','providers/animepahe.js',['movie','tv'],['m3u8'],['en','ja']),
            ('cinemacity','CinemaCity','CinemaCity streams','providers/cinemacity.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
            ('4khdhub','4KHDHub','4K/1080p/720p Movies & TV from 4KHDHub','providers/4khdhub.js',['movie','tv'],['mp4','mkv','m3u8'],['en','hi','ta','te','tl']),
            ('pinoymovieshub','PinoyMoviesHub','Filipino movies & series from PinoyMoviesHub','providers/pinoyhub.js',['movie','tv'],['mp4','m3u8','webm'],['tl','fil','en']),
            ('kisskh','KissKH','Korean dramas and Asian TV shows from KissKH','providers/kisskh.js',['movie','tv'],['m3u8','mp4'],['en','ko','ja','zh']),
            ('okru','OK.ru','OK.ru video streams','providers/okru.js',['movie','tv'],['mp4','m3u8'],['ru','en']),
            ('castle','Castle','Castle streaming provider','providers/castle.js',['movie','tv'],['m3u8','mp4'],['en']),
            ('dooflix','DooFlix','DooFlix streaming provider','providers/dooflix.js',['movie','tv'],['m3u8','mp4'],['en']),
            ('dvdplay','DVDPlay','DVDPlay streaming provider','providers/dvdplay.js',['movie','tv'],['m3u8','mp4'],['en']),
            ('hdhub4u','HDHub4u','HDHub4u provider','providers/hdhub4u.js',['movie','tv'],['m3u8','mp4','mkv'],['en','hi']),
            ('mallumv','MallumV','MallumV provider','providers/mallumv.js',['movie','tv'],['m3u8','mp4'],['en','ml']),
            ('movieblast','MovieBlast','MovieBlast provider','providers/movieblast.js',['movie','tv'],['m3u8','mp4'],['en']),
            ('mycima','MyCima','MyCima provider','providers/mycima.js',['movie','tv'],['m3u8','mp4'],['en','ar']),
            ('netmirror','NetMirror','NetMirror provider','providers/netmirror.js',['movie','tv'],['m3u8','mp4'],['en']),
            ('myflixer','MyFlixer','MyFlixer extractor/provider','providers/myflixer-extractor.js',['movie','tv'],['m3u8','mp4'],['en']),
            ('moviebox-nvv','MovieBox NVV','NVV MovieBox implementation','providers/moviebox.js',['movie','tv'],['m3u8','mp4'],['en']),
        ]
          for sid,name,desc,file,types,formats,langs in entries:
            if not Path(file).exists():
              continue
            old=scrapers.get(sid,{})
            scrapers[sid]={
              'id':sid,'name':name,'description':desc,'version':old.get('version','4.0.0'),
              'author':old.get('author','xrexzerox'),'supportedTypes':types,'filename':file,
              'enabled':old.get('enabled',True),'formats':formats,'contentLanguage':langs
            }
          m['scrapers']=list(scrapers.values())
          m['version']='2.1.0'
          m['description']='Nuvio provider collection combining Streamline and NVV-compatible providers.'
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit merged manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then echo 'Manifest already merged.'; else git commit -m 'Keep NVV providers registered in manifest'; git push; fi
