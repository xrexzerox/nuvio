name: Provider Doctor

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'providers/**'
      - '.github/workflows/provider-doctor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install declared JS dependencies
        run: npm install --ignore-scripts

      - name: Deterministic provider audit
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const scrapers = Array.isArray(manifest.scrapers) ? manifest.scrapers : [];
          const rows = [];
          const ids = new Set();
          const files = new Set();
          const allowedModules = new Set(['cheerio-without-node-native','react-native-cheerio','cheerio','crypto-js','axios','url','querystring','util']);
          const nodeBuiltins = new Set(['fs','path','http','https','net','tls','dns','child_process','worker_threads','cluster','dgram','readline','os','process','module','stream','zlib','buffer']);
          function clean(x){return String(x||'').replace(/\s+/g,' ').trim().slice(0,220);}
          function imports(text){const out=[];let m;const a=/\brequire\(\s*["']([^"']+)["']\s*\)/g;while((m=a.exec(text)))out.push(m[1]);const b=/\bfrom\s*["']([^"']+)["']/g;while((m=b.exec(text)))out.push(m[1]);return [...new Set(out)];}
          for(const s of scrapers){
            const r={id:s.id||'',file:s.filename||'',enabled:!!s.enabled,exists:false,syntax:'FAIL',export:'FAIL',modules:'PASS',error:''};
            if(!r.id||ids.has(r.id)){r.error='duplicate or missing scraper id';rows.push(r);continue;} ids.add(r.id);
            if(!r.file||files.has(r.file)){r.error='duplicate or missing provider filename';rows.push(r);continue;} files.add(r.file);
            if(!fs.existsSync(r.file)){r.error='manifest points to missing file';rows.push(r);continue;} r.exists=true;
            try{cp.execFileSync(process.execPath,['--check',r.file],{stdio:'pipe'});r.syntax='PASS';}catch(e){r.error='syntax: '+clean(e.stderr||e.message);rows.push(r);continue;}
            const text=fs.readFileSync(r.file,'utf8');
            if(!/module\.exports|exports\.getStreams|global(?:This)?\.getStreams/.test(text)){r.error='getStreams export pattern not found';rows.push(r);continue;} r.export='PASS';
            const bad=imports(text).filter(m=>nodeBuiltins.has(m)||(m.startsWith('.')===false&&!allowedModules.has(m)&&!m.startsWith('@')));
            if(bad.length){r.modules='WARN';r.error='imports: '+bad.join(', ');} rows.push(r);
          }
          const missing=rows.filter(r=>!r.exists), syntaxFail=rows.filter(r=>r.syntax!=='PASS'), exportFail=rows.filter(r=>r.export!=='PASS'&&r.syntax==='PASS'), moduleWarn=rows.filter(r=>r.modules==='WARN');
          let md='# Nuvio Provider Doctor\n\nGenerated: '+new Date().toISOString()+'  \n';
          md+='Manifest providers: **'+rows.length+'**  \nMissing files: **'+missing.length+'**  \nSyntax failures: **'+syntaxFail.length+'**  \nExport failures: **'+exportFail.length+'**  \nModule warnings: **'+moduleWarn.length+'**  \n\n';
          md+='| ID | Enabled | File | Exists | Syntax | Export | Modules | Error |\n|---|---:|---|---:|---|---|---|---|\n';
          for(const r of rows.sort((a,b)=>String(a.id).localeCompare(String(b.id)))) md+=`| ${r.id} | ${r.enabled?'yes':'no'} | ${r.file} | ${r.exists?'yes':'no'} | ${r.syntax} | ${r.export} | ${r.modules} | ${r.error.replace(/\|/g,'\\|')} |\n`;
          md+='\n## Notes\n\nPASS means the provider is structurally compatible with the manifest and exports the Nuvio `getStreams` contract. WARN means the bundle references a module that needs compatibility review.\n';
          fs.writeFileSync('PROVIDER-AUDIT.md',md); console.log(md);
          process.exit((missing.length||syntaxFail.length||exportFail.length)?1:0);
          NODE

      - name: Commit audit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROVIDER-AUDIT.md
          if git diff --cached --quiet; then echo 'No report changes.'; else git commit -m 'Add deterministic provider audit report'; git push; fi
