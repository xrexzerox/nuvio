name: Import Streamline Providers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Streamline
        run: git clone --depth 1 https://github.com/itsmeadarsh2008/Streamline.git /tmp/streamline

      - name: Copy provider bundles and source tree
        run: |
          mkdir -p providers src
          cp -f /tmp/streamline/providers/*.js providers/
          cp -R /tmp/streamline/src/. src/
          cp -f /tmp/streamline/build.js ./build.js
          cp -f /tmp/streamline/package.json ./package.json
          if [ -f /tmp/streamline/bun.lock ]; then cp -f /tmp/streamline/bun.lock ./bun.lock; fi
          cp -f /tmp/streamline/LICENSE ./STREAMLINE-LICENSE

      - name: Build combined manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          upstream = json.loads(Path('/tmp/streamline/manifest.json').read_text(encoding='utf-8'))
          existing_path = Path('manifest.json')
          existing = json.loads(existing_path.read_text(encoding='utf-8')) if existing_path.exists() else {}
          pinoy = {
              'id': 'pinoymovieshub',
              'name': 'PinoyMoviesHub',
              'description': 'PinoyMoviesHub catalog and public source-link scraper',
              'version': '1.0.0',
              'author': 'xrexzerox',
              'supportedTypes': ['movie', 'tv'],
              'filename': 'providers/pinoymovieshub.js',
              'enabled': True,
              'hasSettings': False,
              'formats': ['mp4', 'm3u8', 'mkv'],
              'contentLanguage': ['tl', 'en']
          }
          scrapers = list(upstream.get('scrapers', []))
          by_id = {str(x.get('id')): x for x in scrapers if x.get('id')}
          by_id[pinoy['id']] = pinoy
          merged = {
              'name': existing.get('name', 'Nuvio'),
              'version': existing.get('version', upstream.get('version', '1.0.0')),
              'description': 'Nuvio plugin repository with Streamline providers plus PinoyMoviesHub.',
              'author': existing.get('author', 'xrexzerox'),
              'scrapers': list(by_id.values())
          }
          existing_path.write_text(json.dumps(merged, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit imported providers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers src build.js package.json bun.lock STREAMLINE-LICENSE manifest.json || true
          if git diff --cached --quiet; then
            echo "No provider changes to commit."
          else
            git commit -m "Import Streamline providers [skip ci]"
            git push
          fi
