name: Normalize Provider Manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-manifest.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('manifest.json')
          data = json.loads(path.read_text())
          scrapers = data.get('scrapers', [])

          # Prefer the known NVV implementations for overlapping IDs.
          preferred = {
              'pinoymovieshub': 'providers/pinoyhub.js',
              'animotvslash': 'providers/animotvslash.js',
              'animepahe': 'providers/animepahe.js',
              'cinemacity': 'providers/cinemacity.js',
              '4khdhub': 'providers/4khdhub.js',
              'kisskh': 'providers/kisskh.js',
              'okru': 'providers/okru.js',
              'castle': 'providers/castle.js',
              'dooflix': 'providers/dooflix.js',
              'dvdplay': 'providers/dvdplay.js',
          }

          by_id = {}
          for s in scrapers:
              sid = s.get('id')
              if not sid:
                  continue
              if sid not in by_id:
                  by_id[sid] = s
                  continue
              preferred_file = preferred.get(sid)
              current_file = by_id[sid].get('filename')
              new_file = s.get('filename')
              if preferred_file and new_file == preferred_file:
                  by_id[sid] = s
              elif preferred_file and current_file != preferred_file and new_file == current_file:
                  pass

          # 4KHDHub had an additional Streamline registration under a separate ID.
          # Keep the NVV 4khdhub implementation and drop the redundant hdhub alias.
          by_id.pop('hdhub', None)

          # Do not reintroduce stale numbered/new variants or duplicate IDs.
          blocked_stems = ('1', '2', 'new')
          normalized = []
          seen = set()
          for s in by_id.values():
              sid = s.get('id')
              filename = s.get('filename', '')
              stem = Path(filename).stem
              if sid in seen:
                  continue
              if stem.endswith(blocked_stems):
                  continue
              seen.add(sid)
              normalized.append(s)

          data['scrapers'] = normalized
          data['version'] = '2.5.0'
          data['description'] = 'Canonical Nuvio provider collection; duplicate scraper IDs and redundant provider registrations removed.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          ids = [s['id'] for s in normalized]
          assert len(ids) == len(set(ids)), 'duplicate scraper IDs remain'
          print('Canonical providers:', len(ids))
          print('Providers:', ', '.join(ids))
          PY

      - name: Commit normalized manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'No manifest changes required.'
          else
            git commit -m 'Normalize provider manifest and remove duplicate registrations'
            git push
          fi
