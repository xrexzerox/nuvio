name: NVV Resync Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvv-resync-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy current NVV providers
        run: |
          git clone --depth 1 https://github.com/xrexzerox/nvv.git /tmp/nvv
          mkdir -p providers
          cp -f /tmp/nvv/providers/*.js providers/
          cp -f /tmp/nvv/providers/pinoyhub.js providers/pinoymovieshub.js
      - name: Merge NVV entries into existing manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('manifest.json')
          m=json.loads(p.read_text())
          current={x.get('id'):x for x in m.get('scrapers',[]) if x.get('id')}
          entries={
            'animotvslash':('ANIMOTVSLASH','providers/animotvslash.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
            'animepahe':('AnimePahe','providers/animepahe.js',['movie','tv'],['m3u8'],['en','ja']),
            'cinemacity':('CinemaCity','providers/cinemacity.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
            '4khdhub':('4KHDHub','providers/4khdhub.js',['movie','tv'],['mp4','mkv','m3u8'],['en','hi','ta','te','tl']),
            'pinoymovieshub':('PinoyMoviesHub','providers/pinoyhub.js',['movie','tv'],['mp4','m3u8','webm'],['tl','fil','en']),
            'kisskh':('KissKH','providers/kisskh.js',['movie','tv'],['m3u8','mp4'],['en','ko','ja','zh']),
            'okru':('OK.ru','providers/okru.js',['movie','tv'],['mp4','m3u8'],['ru','en']),
            'castle':('Castle','providers/castle.js',['movie','tv'],['m3u8','mp4'],['en']),
            'dooflix':('DooFlix','providers/dooflix.js',['movie','tv'],['m3u8','mp4'],['en']),
            'dvdplay':('DVDPlay','providers/dvdplay.js',['movie','tv'],['m3u8','mp4'],['en']),
            'hdhub4u':('HDHub4u','providers/hdhub4u.js',['movie','tv'],['m3u8','mp4','mkv'],['en','hi']),
            'mallumv':('MallumV','providers/mallumv.js',['movie','tv'],['m3u8','mp4'],['en','ml']),
            'movieblast':('MovieBlast','providers/movieblast.js',['movie','tv'],['m3u8','mp4'],['en']),
            'mycima':('MyCima','providers/mycima.js',['movie','tv'],['m3u8','mp4'],['en','ar']),
            'netmirror':('NetMirror','providers/netmirror.js',['movie','tv'],['m3u8','mp4'],['en']),
            'myflixer':('MyFlixer','providers/myflixer-extractor.js',['movie','tv'],['m3u8','mp4'],['en']),
          }
          for sid,(name,file,types,formats,langs) in entries.items():
            if Path(file).exists():
              old=current.get(sid,{})
              current[sid]={'id':sid,'name':name,'description':'NVV-compatible provider','version':old.get('version','4.0.0'),'author':'xrexzerox','supportedTypes':types,'filename':file,'enabled':old.get('enabled',True),'formats':formats,'contentLanguage':langs}
          m['scrapers']=list(current.values())
          m['version']='2.2.0'
          m['description']='Nuvio provider collection with Streamline and NVV-compatible providers.'
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add providers manifest.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Resync NVV providers and manifest'; git push; fi
