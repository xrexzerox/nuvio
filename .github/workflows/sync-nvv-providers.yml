name: Sync NVV Providers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-nvv-providers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nuvio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch NVV provider repository
        run: |
          git clone --depth 1 https://github.com/xrexzerox/nvv.git /tmp/nvv
          test -d /tmp/nvv/providers

      - name: Copy canonical NVV providers
        run: |
          mkdir -p providers
          # Copy the canonical providers only. Numbered/new variants are intentionally excluded.
          for f in \
            animotvslash.js animepahe.js cinemacity.js 4khdhub.js \
            pinoyhub.js kisskh.js okru.js castle.js dooflix.js dvdplay.js \
            hdhub4u.js mallumv.js movieblast.js mycima.js netmirror.js; do
            if [ -f "/tmp/nvv/providers/$f" ]; then
              cp -f "/tmp/nvv/providers/$f" providers/
            fi
          done
          # Remove previously imported duplicate/variant files.
          rm -f providers/4khdhub1.js providers/4khdhub2.js providers/4khdhubnew.js
          rm -f providers/animotvslash1.js providers/animotvslash2.js
          rm -f providers/cinemacity1.js providers/kisskh1.js
          rm -f providers/pinoymovieshub.js

      - name: Copy NVV build/config references
        run: |
          cp -f /tmp/nvv/build.js ./nvv-build.js
          cp -f /tmp/nvv/DOCUMENTATION.md ./NVV-DOCUMENTATION.md

      - name: Reconcile manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {
              'name': 'Nuvio', 'version': '1.0.0', 'description': 'Nuvio provider collection', 'scrapers': []
          }

          # Canonical NVV registrations. These use the exact filenames copied above.
          nvv = [
              ('animotvslash','ANIMOTVSLASH','Anime streams from animotvslash.org','providers/animotvslash.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
              ('animepahe','AnimePahe','AnimePahe Sub/Dub streams','providers/animepahe.js',['movie','tv'],['m3u8'],['en','ja']),
              ('cinemacity','CinemaCity','CinemaCity streams','providers/cinemacity.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
              ('4khdhub','4KHDHub','4K/1080p/720p Movies & TV from 4KHDHub','providers/4khdhub.js',['movie','tv'],['mp4','mkv','m3u8'],['en','hi','ta','te','tl']),
              ('pinoymovieshub','PinoyMoviesHub','Filipino movies & series from PinoyMoviesHub','providers/pinoyhub.js',['movie','tv'],['mp4','m3u8','webm'],['tl','fil','en']),
              ('kisskh','KissKH','Korean dramas and Asian TV shows from KissKH','providers/kisskh.js',['movie','tv'],['m3u8','mp4'],['en','ko','ja','zh']),
              ('okru','OK.ru','OK.ru video streams','providers/okru.js',['movie','tv'],['mp4','m3u8'],['ru','en']),
              ('castle','Castle','Castle streaming provider','providers/castle.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('dooflix','DooFlix','DooFlix streaming provider','providers/dooflix.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('dvdplay','DVDPlay','DVDPlay streaming provider','providers/dvdplay.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('hdhub4u','HDHub4u','HDHub4u provider','providers/hdhub4u.js',['movie','tv'],['m3u8','mp4','mkv'],['en','hi']),
              ('mallumv','MallumV','MallumV provider','providers/mallumv.js',['movie','tv'],['m3u8','mp4'],['en','ml']),
              ('movieblast','MovieBlast','MovieBlast provider','providers/movieblast.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('mycima','MyCima','MyCima provider','providers/mycima.js',['movie','tv'],['m3u8','mp4'],['en','ar']),
              ('netmirror','NetMirror','NetMirror provider','providers/netmirror.js',['movie','tv'],['m3u8','mp4'],['en']),
          ]

          rows = {s.get('id'): s for s in manifest.get('scrapers', []) if s.get('id')}
          # Remove duplicate/variant registrations and the old duplicate PinoyMoviesHub filename.
          remove_ids = {'4khdhub1','4khdhub2','4khdhubnew','animotvslash1','animotvslash2','cinemacity1','kisskh1'}
          for rid in remove_ids:
              rows.pop(rid, None)

          # Canonicalize PinoyMoviesHub to the NVV implementation.
          for sid,name,desc,filename,types,formats,langs in nvv:
              row = rows.get(sid, {})
              row.update({
                  'id': sid, 'name': name, 'description': desc, 'version': '4.0.0',
                  'author': 'xrexzerox', 'supportedTypes': types, 'filename': filename,
                  'enabled': True, 'formats': formats, 'contentLanguage': langs
              })
              rows[sid] = row

          # Remove entries pointing at files that no longer exist.
          rows = {sid:s for sid,s in rows.items() if s.get('filename') and Path(s['filename']).exists()}

          # Remove duplicate filename registrations, keeping the first canonical entry.
          seen_files = set()
          clean = []
          for s in rows.values():
              f = s.get('filename')
              if f in seen_files:
                  continue
              seen_files.add(f)
              clean.append(s)

          manifest['scrapers'] = clean
          manifest['version'] = '2.3.0'
          manifest['description'] = 'Nuvio provider collection with canonical NVV-compatible providers and Streamline providers.'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Validate no duplicate provider files in manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text())
          rows=m.get('scrapers',[])
          ids=[x.get('id') for x in rows]
          files=[x.get('filename') for x in rows]
          assert len(ids)==len(set(ids)), 'duplicate scraper ids'
          assert len(files)==len(set(files)), 'duplicate scraper filenames'
          for f in files:
              assert f and Path(f).exists(), f'missing provider: {f}'
          print(f'Validated {len(rows)} registered providers.')
          PY

      - name: Commit synchronized providers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add providers manifest.json nvv-build.js NVV-DOCUMENTATION.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Clean duplicate NVV providers and manifest'
            git push
          fi
