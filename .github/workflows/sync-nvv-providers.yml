name: Sync NVV Providers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-nvv-providers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nuvio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch NVV provider repository
        run: |
          git clone --depth 1 https://github.com/xrexzerox/nvv.git /tmp/nvv
          test -d /tmp/nvv/providers
          echo "NVV providers:"
          find /tmp/nvv/providers -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort

      - name: Copy NVV providers
        run: |
          mkdir -p providers
          cp -f /tmp/nvv/providers/*.js providers/
          # The NVV PinoyMoviesHub implementation is the known working one.
          # Keep the current filename too for compatibility with older manifests.
          cp -f /tmp/nvv/providers/pinoyhub.js providers/pinoymovieshub.js

      - name: Copy NVV build/config references
        run: |
          cp -f /tmp/nvv/build.js ./nvv-build.js
          cp -f /tmp/nvv/DOCUMENTATION.md ./NVV-DOCUMENTATION.md

      - name: Update manifest with NVV providers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {
              'name': 'Nuvio', 'version': '1.0.0', 'description': 'Nuvio plugin repository', 'scrapers': []
          }
          existing = {s.get('id'): s for s in manifest.get('scrapers', []) if s.get('id')}

          nvv = [
              ('animotvslash','ANIMOTVSLASH','Anime streams from animotvslash.org','providers/animotvslash.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
              ('animepahe','AnimePahe','AnimePahe Sub/Dub streams','providers/animepahe.js',['movie','tv'],['m3u8'],['en','ja']),
              ('cinemacity','CinemaCity','CinemaCity streams','providers/cinemacity.js',['movie','tv'],['m3u8','mp4'],['en','ja']),
              ('4khdhub','4KHDHub','4K/1080p/720p Movies & TV from 4KHDHub','providers/4khdhub.js',['movie','tv'],['mp4','mkv','m3u8'],['en','hi','ta','te','tl']),
              ('pinoymovieshub','PinoyMoviesHub','Filipino movies & series from PinoyMoviesHub','providers/pinoyhub.js',['movie','tv'],['mp4','m3u8','webm'],['tl','fil','en']),
              ('kisskh','KissKH','Korean dramas and Asian TV shows from KissKH','providers/kisskh.js',['movie','tv'],['m3u8','mp4'],['en','ko','ja','zh']),
              ('okru','OK.ru','OK.ru video streams','providers/okru.js',['movie','tv'],['mp4','m3u8'],['ru','en']),
              ('castle','Castle','Castle streaming provider','providers/castle.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('dooflix','DooFlix','DooFlix streaming provider','providers/dooflix.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('dvdplay','DVDPlay','DVDPlay streaming provider','providers/dvdplay.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('hdhub4u','HDHub4u','HDHub4u provider','providers/hdhub4u.js',['movie','tv'],['m3u8','mp4','mkv'],['en','hi']),
              ('mallumv','MallumV','MallumV provider','providers/mallumv.js',['movie','tv'],['m3u8','mp4'],['en','ml']),
              ('movieblast','MovieBlast','MovieBlast provider','providers/movieblast.js',['movie','tv'],['m3u8','mp4'],['en']),
              ('mycima','MyCima','MyCima provider','providers/mycima.js',['movie','tv'],['m3u8','mp4'],['en','ar']),
              ('netmirror','NetMirror','NetMirror provider','providers/netmirror.js',['movie','tv'],['m3u8','mp4'],['en']),
          ]
          for sid,name,desc,filename,types,formats,langs in nvv:
              existing[sid] = {
                  'id': sid, 'name': name, 'description': desc, 'version': '4.0.0',
                  'author': 'xrexzerox', 'supportedTypes': types, 'filename': filename,
                  'enabled': True, 'formats': formats, 'contentLanguage': langs
              }

          # Also keep alternate NVV provider variants available, but disabled by default.
          for p in Path('providers').glob('*.js'):
              stem = p.stem
              if stem.endswith(('1','2','new')) and stem not in existing:
                  existing[stem] = {
                      'id': stem, 'name': stem.upper(), 'description': 'NVV compatibility variant',
                      'version': '1.0.0', 'author': 'xrexzerox', 'supportedTypes': ['movie','tv'],
                      'filename': str(p).replace('\\','/'), 'enabled': False, 'formats': ['mp4','m3u8','mkv'],
                      'contentLanguage': ['en']
                  }

          manifest['scrapers'] = list(existing.values())
          manifest['version'] = '2.0.0'
          manifest['description'] = 'Nuvio provider collection combining NVV compatibility providers and Streamline providers.'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Commit synchronized providers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add providers manifest.json nvv-build.js NVV-DOCUMENTATION.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Sync NVV providers and compatibility manifest'
            git push
          fi
