name: Restore PinoyHub Manifest
on:
  push:
    paths:
      - '.github/workflows/restore-pinoyhub-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore manifest entry
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('manifest.json')
          data = json.loads(p.read_text())
          scrapers = data.get('scrapers', [])
          entry = {
            'id': 'pinoymovieshub',
            'name': 'PinoyMoviesHub',
            'description': 'Filipino movies and series from PinoyMoviesHub',
            'version': '4.1.0',
            'author': 'xrexzerox',
            'supportedTypes': ['movie', 'tv'],
            'filename': 'providers/pinoyhub.js',
            'enabled': True,
            'formats': ['mp4', 'm3u8', 'mkv', 'webm'],
            'contentLanguage': ['tl', 'fil', 'en']
          }
          found = False
          for i, s in enumerate(scrapers):
            if s.get('id') == 'pinoymovieshub' or s.get('filename') in ('providers/pinoymovieshub.js', 'providers/pinoyhub.js'):
              scrapers[i] = entry
              found = True
              break
          if not found:
            scrapers.append(entry)
          data['scrapers'] = scrapers
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/restore-pinoyhub-manifest.yml
          git add manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore PinoyMoviesHub manifest entry'
          git push